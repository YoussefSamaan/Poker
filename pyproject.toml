[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-research-lab"
version = "0.1.0"
description = "Offline poker simulation, analysis, and imperfect-information game research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
trainer = ["streamlit>=1.55,<2"]

[tool.setuptools.packages.find]
include = ["poker_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
